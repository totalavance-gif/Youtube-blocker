plugins {
    id 'com.android.application' version '8.5.2'
}

// AGP 8 exige el namespace aqui; AIDE lo necesita en el manifest.
// Copia filtrada solo para Gradle (AIDE usa el original intacto).
def rawManifest = file("AndroidManifest.xml")
def filteredManifest = file("$buildDir/filtered/AndroidManifest.xml")
filteredManifest.parentFile.mkdirs()
filteredManifest.text = rawManifest.text.replaceFirst(
        /\s*package="[^"]*"/, "")

android {
    namespace 'com.nexos.youtubeblocker'
    compileSdk 34

    defaultConfig {
        applicationId 'com.nexos.youtubeblocker'
        minSdk 19
        targetSdk 28
        versionCode 4
        versionName '1.2.1'
    }

    // Misma estructura Eclipse ADT que usa AIDE, mas stubs solo-Gradle.
    sourceSets {
        main {
            manifest.srcFile filteredManifest
            java.srcDirs = ['src', 'gradle-stubs']
            res.srcDirs = ['res']
            assets.srcDirs = ['assets']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

// Release firmada solo si hay keystore en variables de entorno
// (KEYSTORE_FILE, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
// Sin ellas, release sale sin firmar y debug no se ve afectado.
if (System.getenv("KEYSTORE_FILE")) {
    android.signingConfigs {
        release {
            storeFile file(System.getenv("KEYSTORE_FILE"))
            storePassword System.getenv("KEYSTORE_PASSWORD")
            keyAlias System.getenv("KEY_ALIAS")
            keyPassword System.getenv("KEY_PASSWORD")
        }
    }
    android.buildTypes.release.signingConfig =
            android.signingConfigs.release
}
